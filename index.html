<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team IGN - Realtime Promotion</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Noto Sans Thai -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans Thai', sans-serif;
            background-color: #F7F5F0; /* Muji warm off-white */
            color: #4A4A4A;
        }
        .muji-card {
            background-color: #FFFFFF;
            border: 1px solid #EAE6DF;
            transition: all 0.2s ease-in-out;
        }
        .muji-card:hover {
            border-color: #D6CEC2;
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.04);
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #F7F5F0;
        }
        ::-webkit-scrollbar-thumb {
            background: #E0DCD3;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #C5C0B3;
        }
    </style>
</head>
<body class="min-h-screen pb-24 relative">

    <!-- Floating Top-Right Refresh Button -->
    <button id="refreshBtn" onclick="manualRefresh()" title="รีโหลดข้อมูล" class="fixed top-4 right-4 z-40 bg-white/90 backdrop-blur-md border border-stone-200 shadow-md hover:bg-stone-50 text-stone-700 hover:text-stone-900 w-10 h-10 rounded-full flex items-center justify-center transition-all duration-200 group active:scale-95">
        <svg id="refreshIcon" class="w-5 h-5 text-stone-600 group-hover:text-stone-900 transition-transform duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
        </svg>
    </button>

    <!-- Notification / Toast message -->
    <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-stone-800 text-white px-4 py-2 rounded-lg text-sm shadow-lg transition-opacity duration-300 opacity-0 pointer-events-none">
        อัปเดตข้อมูลเรียบร้อยแล้ว
    </div>

    <!-- Main Content Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 pb-12">
        
        <!-- Refreshing/Loading Overlay -->
        <div id="loadingState" class="flex flex-col items-center justify-center py-24 space-y-4">
            <div class="w-10 h-10 border-4 border-stone-300 border-t-stone-700 rounded-full animate-spin"></div>
            <p class="text-stone-500 font-medium text-sm tracking-wide">กำลังโหลดข้อมูลโปรโมชั่น...</p>
        </div>

        <!-- Error State -->
        <div id="errorState" class="hidden flex-col items-center justify-center py-20 px-4 text-center">
            <div class="w-12 h-12 rounded-full bg-red-100 text-red-700 flex items-center justify-center mb-3">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>
            <p class="text-stone-800 font-semibold text-lg mb-1" id="errorMessage">ไม่สามารถดึงข้อมูลโปรโมชั่นได้</p>
            <p class="text-stone-500 text-sm max-w-md mb-4">โปรดตรวจสอบสัญญาณอินเทอร์เน็ต หรือสถานะของ Google Sheet</p>
            <button onclick="fetchSheetData()" class="px-5 py-2 bg-stone-800 text-stone-100 hover:bg-stone-700 text-sm font-medium rounded-lg transition-colors">
                ลองอีกครั้ง
            </button>
        </div>

        <!-- Product Grid (Clean Muji Cards) -->
        <div id="productGrid" class="hidden grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
            <!-- Dynamic product cards inserted here -->
        </div>

    </main>

    <!-- Floating Live Date & Time Bar -->
    <div class="fixed bottom-4 left-1/2 -translate-x-1/2 z-40">
        <div class="bg-white/90 backdrop-blur-md border border-stone-200/80 shadow-lg px-5 py-2.5 rounded-full flex items-center gap-3 text-stone-700">
            <div class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span id="currentDateText" class="text-xs sm:text-sm font-medium tracking-wide">กำลังดึงวันที่...</span>
            </div>
            <span class="text-stone-300">|</span>
            <span id="currentTimeText" class="text-xs sm:text-sm font-bold font-mono tracking-wider text-stone-900">00:00:00</span>
        </div>
    </div>

    <!-- Logic Script -->
    <script>
        // Google Apps Script Web App Endpoint URL
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyS-QoKeqlE7afmtUJjGxgy6CIuMnhBz5YtXBvG10JtUy0CeWU4GhwkBkJqJivHoPNT/exec';

        // Doctors Data Config
        const DOCTORS = [
            {
                id: 'mew',
                name: 'หมอหมิว',
                avatar: 'https://res.cloudinary.com/yuyprw6e/image/upload/v1793473207/mew_header.png',
                keys: ['price_mew', 'mew', 'ราคาหมอหมิว', 'หมอหมิว']
            },
            {
                id: 'gun',
                name: 'หมอกัน',
                avatar: 'https://res.cloudinary.com/yuyprw6e/image/upload/v1793473206/gungun_header.png',
                keys: ['price_gun', 'gun', 'ราคาหมอกัน', 'หมอกัน']
            },
            {
                id: 'nana',
                name: 'หมอนานะ',
                avatar: 'https://res.cloudinary.com/yuyprw6e/image/upload/v1793473206/nana_header.png',
                keys: ['price_nana', 'nana', 'ราคาหมอนานะ', 'หมอนานะ']
            }
        ];

        // Column Key Aliases
        const NAME_KEYS = ['name', 'title', 'product', 'ชื่อ', 'ชื่อสินค้า', 'รายการ', 'สินค้า'];
        const IMAGE_KEYS = ['image', 'img', 'picture', 'photo', 'รูปภาพ', 'รูป', 'ภาพประกอบ'];
        const DESC_KEYS = ['desc', 'description', 'detail', 'รายละเอียด', 'คำบรรยาย'];
        const NORMAL_PRICE_KEYS = ['price_normal', 'normal_price', 'normal', 'ราคาปกติ', 'ปกติ'];

        // Toast Notification Helper
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2000);
        }

        // Real-time Clock Function
        function updateClock() {
            const now = new Date();
            const daysThai = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
            const monthsThai = [
                'ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 
                'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'
            ];

            const dayName = daysThai[now.getDay()];
            const dateNum = now.getDate();
            const monthName = monthsThai[now.getMonth()];
            const yearThai = now.getFullYear() + 543;

            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');

            document.getElementById('currentDateText').innerText = `วัน${dayName}ที่ ${dateNum} ${monthName} ${yearThai}`;
            document.getElementById('currentTimeText').innerText = `${hours}:${minutes}:${seconds}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Utility: Find value from multiple key aliases
        function getValueByKeys(row, keys) {
            if (!row) return '';
            const rowKeys = Object.keys(row);
            for (const key of keys) {
                const foundKey = rowKeys.find(k => k.trim().toLowerCase() === key.toLowerCase());
                if (foundKey && row[foundKey] !== undefined && row[foundKey] !== null) {
                    return row[foundKey];
                }
            }
            return '';
        }

        // Utility: Parse price to integer/float
        function parsePrice(val) {
            if (val === undefined || val === null || val === '') return null;
            if (typeof val === 'number') return val;
            const strVal = String(val).replace(/,/g, '').replace(/[^\d.]/g, '');
            const num = parseFloat(strVal);
            return isNaN(num) ? null : num;
        }

        // Utility: Format price with commas
        function formatPrice(val) {
            const num = parsePrice(val);
            if (num === null) return '-';
            return '฿' + num.toLocaleString('th-TH');
        }

        // Render Cards
        function renderProducts(data) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';

            if (!data || !Array.isArray(data) || data.length === 0) {
                showError('ไม่พบข้อมูลรายการโปรโมชั่นในระบบ');
                return;
            }

            // Filter out empty rows
            const validRows = data.filter(row => {
                const name = getValueByKeys(row, NAME_KEYS);
                return name && name.toString().trim() !== '';
            });

            if (validRows.length === 0) {
                showError('ไม่พบรายการสินค้าที่ระบุชื่อใน Sheet');
                return;
            }

            validRows.forEach((row) => {
                const name = getValueByKeys(row, NAME_KEYS);
                const image = getValueByKeys(row, IMAGE_KEYS);
                const desc = getValueByKeys(row, DESC_KEYS);
                const normalPrice = getValueByKeys(row, NORMAL_PRICE_KEYS);

                // Calculate Doctor Prices & Find Lowest
                let validPrices = [];
                const doctorPrices = DOCTORS.map(doc => {
                    const rawVal = getValueByKeys(row, doc.keys);
                    const numVal = parsePrice(rawVal);
                    if (numVal !== null) {
                        validPrices.push(numVal);
                    }
                    return {
                        ...doc,
                        rawPrice: rawVal,
                        priceNum: numVal
                    };
                });

                // Calculate minPrice (if valid prices exist)
                const minPrice = validPrices.length > 0 ? Math.min(...validPrices) : null;

                // Create Card Element
                const card = document.createElement('div');
                card.className = 'muji-card rounded-2xl p-5 flex flex-col justify-between space-y-4';

                // Image Fallback HTML
                const imageHtml = image ? `
                    <div class="w-full h-48 rounded-xl overflow-hidden bg-stone-100 mb-2">
                        <img src="${image}" alt="${name}" class="w-full h-full object-cover" onerror="this.onerror=null; this.parentElement.style.display='none';">
                    </div>
                ` : '';

                // Header: Name (xl) & Normal Price (base)
                const headerHtml = `
                    <div>
                        ${imageHtml}
                        <div class="flex items-start justify-between gap-3">
                            <h2 class="text-xl font-bold text-stone-800 leading-snug flex-1">${name}</h2>
                            ${normalPrice ? `
                                <div class="text-right flex-shrink-0">
                                    <span class="block text-xs text-stone-400 font-medium">ราคาปกติ</span>
                                    <span class="text-base font-semibold text-stone-400 line-through">${formatPrice(normalPrice)}</span>
                                </div>
                            ` : ''}
                        </div>
                        ${desc ? `<p class="text-stone-500 text-xs mt-1.5 leading-relaxed">${desc}</p>` : ''}
                    </div>
                `;

                // Doctor Price Boxes
                let doctorBoxesHtml = '<div class="space-y-2.5 pt-1">';
                doctorPrices.forEach(doc => {
                    // Check if lowest price (True even if all equal)
                    const isLowest = (minPrice !== null && doc.priceNum !== null && doc.priceNum === minPrice);

                    doctorBoxesHtml += `
                        <div class="relative flex items-center justify-between p-3 rounded-xl transition-all duration-200 border ${
                            isLowest 
                                ? 'bg-amber-50/60 border-amber-600/40 shadow-sm' 
                                : 'bg-stone-50 border-stone-200/70'
                        }">
                            
                            <!-- Left: Doctor Info -->
                            <div class="flex items-center space-x-3 z-10">
                                <div class="relative">
                                    <img src="${doc.avatar}" alt="${doc.name}" class="w-10 h-10 rounded-full object-cover border border-stone-200 shadow-sm" onerror="this.src='https://placehold.co/100x100/EAE6DF/4A4A4A?text=Doc'">
                                </div>
                                <div>
                                    <div class="flex items-center gap-1.5">
                                        <span class="font-semibold text-stone-800 text-sm">${doc.name}</span>
                                    </div>
                                    <span class="text-[11px] text-stone-400 block">${isLowest ? 'ราคาดีที่สุด' : 'ราคาโปรโมชั่น'}</span>
                                </div>
                            </div>

                            <!-- Right: Price & Lowest Badge -->
                            <div class="text-right flex items-center gap-2">
                                ${isLowest ? `
                                    <span class="bg-amber-700 text-white text-[10px] font-bold px-2 py-0.5 rounded-full shadow-sm">
                                        ถูกที่สุด
                                    </span>
                                ` : ''}
                                <span class="text-base font-bold text-stone-800 tracking-tight">
                                    ${formatPrice(doc.rawPrice)}
                                </span>
                            </div>
                        </div>
                    `;
                });
                doctorBoxesHtml += '</div>';

                card.innerHTML = headerHtml + doctorBoxesHtml;
                grid.appendChild(card);
            });

            document.getElementById('loadingState').classList.add('hidden');
            document.getElementById('errorState').classList.add('hidden');
            grid.classList.remove('hidden');
        }

        // Show Error UI
        function showError(msg) {
            document.getElementById('loadingState').classList.add('hidden');
            document.getElementById('productGrid').classList.add('hidden');
            document.getElementById('errorMessage').innerText = msg || 'เกิดข้อผิดพลาดในการโหลดข้อมูล';
            document.getElementById('errorState').classList.remove('hidden');
            document.getElementById('errorState').classList.add('flex');
        }

        // Fetch Data from Google Apps Script Web App
        async function fetchSheetData() {
            document.getElementById('loadingState').classList.remove('hidden');
            document.getElementById('errorState').classList.add('hidden');

            try {
                const response = await fetch(WEB_APP_URL, {
                    method: 'GET',
                    redirect: 'follow'
                });

                if (!response.ok) {
                    throw new Error(`HTTP Error: ${response.status}`);
                }

                const data = await response.json();
                renderProducts(data);
            } catch (err) {
                console.error('Fetch Error:', err);
                showError('ไม่สามารถเชื่อมต่อกับ Google Sheets ได้');
            }
        }

        // Manual Refresh Handler
        function manualRefresh() {
            const icon = document.getElementById('refreshIcon');
            const btn = document.getElementById('refreshBtn');
            
            btn.disabled = true;
            icon.classList.add('animate-spin');

            fetchSheetData().then(() => {
                showToast('อัปเดตข้อมูลเรียบร้อยแล้ว');
                setTimeout(() => {
                    icon.classList.remove('animate-spin');
                    btn.disabled = false;
                }, 500);
            });
        }

        // Initial Load & Auto Refresh (Every 30s)
        window.onload = function() {
            fetchSheetData();
            setInterval(fetchSheetData, 60000); // 60 seconds auto-refresh
        };
    </script>
</body>
</html>
